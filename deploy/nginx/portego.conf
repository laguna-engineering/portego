# /etc/nginx/conf.d/portego.conf
#
# One upstream serves both hostnames. The application dispatches on the Host
# header: src/server/app.ts answers 404 for a /preview/ path on the application
# host, and for every non-preview path on the content host. The MCP transport
# runs with DNS rebinding protection against an allowed-hosts list built from
# APP_URL. Both break if this proxy rewrites Host, so `proxy_set_header Host
# $host` is required. The application enforces the split, so this file needs no
# per-host routing rules.

upstream portego {
    server 127.0.0.1:3333;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name share.acme.example content.share.acme.example;

    # Leaves the ACME http-01 path reachable so a renewal cannot be redirected
    # away before it is answered.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` is accepted by every nginx in use. nginx 1.25.1 and
    # later log a deprecation warning for it and prefer `listen 443 ssl;` with a
    # separate `http2 on;`, which older builds reject outright as an unknown
    # directive. Switch once the host is known to be 1.25.1 or later.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name share.acme.example content.share.acme.example;

    ssl_certificate     /etc/letsencrypt/live/share.acme.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/share.acme.example/privkey.pem;
    # Protocols, ciphers, and session settings come from the file certbot
    # maintains. No OCSP stapling: Let's Encrypt retired its responders.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The application sets its own Content-Security-Policy, Permissions-Policy,
    # and Referrer-Policy on previews. Adding those here would send duplicates
    # that a browser intersects, which can only break a preview. HSTS is the one
    # header the application does not set.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Bun accepts ARTIFACT_MAX_BYTES plus 16 KiB of multipart overhead
    # (src/server/index.ts:38). The limit here sits above that, so an oversized
    # upload reaches the application and receives its FILE_TOO_LARGE JSON
    # instead of an nginx error page.
    client_max_body_size 6m;

    # An MCP client that registers with a Client ID Metadata Document needs that
    # document reachable without a session: the authorization server fetches it
    # over HTTPS before any user is involved, and follows no redirect. The
    # application serves only /assets/ from disk and answers every other path
    # with index.html, so the document cannot be served from the release.
    #
    # `location =` with `alias` exposes this one path and nothing else. There is
    # no directory, no traversal, and no second file. Add a block per client.
    location = /mcp-clients/pi.json {
        alias /var/www/html/mcp-clients/pi.json;
        default_type application/json;
    }

    location = /mcp-clients/claude-code.json {
        alias /var/www/html/mcp-clients/claude-code.json;
        default_type application/json;
    }

    # The change stream. It stays open for as long as the page is, and nginx
    # buffers a proxied response by default, which would hold every event until
    # the buffer filled or the connection ended. The read timeout has to outlast
    # the heartbeat the application writes, or nginx would close a healthy
    # stream on its own schedule.
    location = /api/events {
        proxy_pass http://portego;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_connect_timeout 5s;
    }

    # No `root` directive. Apart from the exact files named above, this block
    # proxies every path and serves nothing from disk, which keeps dotfiles, the
    # source tree, DATA_DIR, and the environment file unreachable.
    location / {
        proxy_pass http://portego;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Every path here answers and finishes. The one long-lived stream has
        # its own block above. This covers the slowest tool call.
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
