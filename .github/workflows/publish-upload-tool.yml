name: Publish portego-upload

# Runs for a tag such as portego-upload-v0.1.0. The version in
# tools/portego-upload/package.json has to match the tag.
on:
  push:
    tags: ["portego-upload-v*"]

# id-token lets npm verify this workflow as the package's trusted publisher,
# so the job holds no npm token.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: The tag matches the package version
        run: |
          version=$(jq -r .version tools/portego-upload/package.json)
          [ "$GITHUB_REF_NAME" = "portego-upload-v$version" ] || {
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          }

      - run: bun test tools

      - run: bun run build:upload-tool

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # `npm stage` is in npm 11.19 and later.
      - run: npm install -g npm@11

      # Staged, so a person approves the version on npmjs.com with 2FA before
      # anyone can install it. The trusted publisher is not allowed to publish
      # directly.
      - run: npm stage publish .
        working-directory: tools/portego-upload
